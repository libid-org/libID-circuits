name: CI

# Three jobs. `circuits` proves that the committed sources build under the
# pinned toolchain: tests pass, every circuit compiles, every vk generates,
# and every Solidity verifier generates under its pinned contract name,
# compiles the way consumers compile it, and verifies a proof of each
# committed witness on chain. Nothing built here is kept — artifacts are
# never committed and ship exclusively as release assets, rebuilt from
# source by release.yml.
# `handles-table` checks lib/identity's generated table against
# libID-contracts' handles.json, and the vendored witness fixtures and the
# Google fixture's digest against its ceremony session fixtures, at the
# commit contracts.ref pins.
# `dco` checks the Signed-off-by trailer CONTRIBUTING.md promises.
#
# Every third-party action is pinned by commit SHA, with the tag in a
# comment, so a moved tag cannot change what executes.
#
# Network note: `nargo compile` fetches the git dependencies declared in each
# Nargo.toml (github.com/zkpassport, github.com/noir-lang) on a cold cache.
# The versions are tag-pinned in Nargo.toml, and the fetched tree is part of
# the cached ~/.nargo, so a warm cache compiles without touching the network.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Superseded pushes stop burning minutes immediately.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Foundry for scripts/check-verifiers.sh, the release libID-contracts CI
  # pins.
  FOUNDRY_VERSION: v1.7.1

jobs:
  # ---------------------------------------------------------------------------
  # Circuits: pinned toolchain, tests, full artifact build, verifier check.
  # ---------------------------------------------------------------------------
  circuits:
    name: Circuits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # toolchain.env is the single source of truth for the pins; export it
      # so the cache key and the install steps can never disagree with it.
      - name: Read toolchain pins
        run: cat toolchain.env | grep -E '^(NARGO|BB)_VERSION=' >> "$GITHUB_ENV"

      # nargo and bb are ~hundreds of MB and are re-downloaded on every run
      # otherwise. Keyed on BOTH pinned versions, so a bump in toolchain.env
      # invalidates the cache automatically rather than silently reusing the
      # wrong toolchain — which would silently change what release.yml would
      # later build from the same cache.
      - name: Cache Noir toolchains
        id: noir-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.nargo
            ~/.bb
          key: noir-${{ runner.os }}-nargo-${{ env.NARGO_VERSION }}-bb-${{ env.BB_VERSION }}

      - name: Install nargo (pinned)
        if: steps.noir-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup --version "${NARGO_VERSION}"
          nargo --version

      - name: Install barretenberg (pinned)
        if: steps.noir-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/master/barretenberg/bbup/install | bash
          export PATH="$HOME/.bb:$PATH"
          bbup --version "${BB_VERSION}"
          bb --version

      # The install steps above put nothing on the persistent PATH, and are
      # skipped entirely on a cache hit — so do it unconditionally here.
      - name: Put Noir toolchains on PATH
        run: |
          set -euo pipefail
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"

      - name: Verify pinned toolchain versions
        run: |
          set -euo pipefail
          nargo --version | grep -qF "nargo version = ${NARGO_VERSION}"
          [ "$(bb --version | tail -1)" = "${BB_VERSION}" ]

      - name: nargo fmt
        run: |
          set -euo pipefail
          for dir in lib/*/ circuits/*/; do
            echo "==> $dir"
            (cd "$dir" && nargo fmt --check)
          done

      - name: shellcheck
        run: shellcheck scripts/*.sh

      # Every circuit carries its own #[test] fns in src/main.nr, and
      # lib/identity runs the handles.json vector table (src/table_tests.nr) and
      # its own tests (src/tests.nr).
      - name: nargo test
        run: |
          set -euo pipefail
          for dir in lib/*/ circuits/*/; do
            echo "==> $dir"
            (cd "$dir" && nargo test)
          done

      # Every committed witness is a script's output: oidc-google's from a
      # synthetic key, the bearer-link ones from the synthetic fixtures in
      # fixtures/. A regeneration is byte-identical; a drift fails here.
      - name: Witnesses are reproducible
        run: |
          set -euo pipefail
          python3 scripts/google-fixture-witness.py --out "$RUNNER_TEMP/oidc-google.Prover.toml"
          diff -u circuits/oidc-google/Prover.toml "$RUNNER_TEMP/oidc-google.Prover.toml"
          for platform in x github; do
            python3 scripts/identity-link-witness.py "fixtures/$platform-identity-link-witness.json" \
              --out "$RUNNER_TEMP/bearer-link-$platform.Prover.toml"
            diff -u "circuits/bearer-link-$platform/Prover.toml" "$RUNNER_TEMP/bearer-link-$platform.Prover.toml"
          done

      # A witness without the synthetic marker is secret: it never goes to
      # stdout, and --out is written with mode 0600.
      - name: Secret witness guard
        run: |
          set -euo pipefail
          script=scripts/identity-link-witness.py
          bare="$RUNNER_TEMP/capture.json"
          jq .identity_link_witness fixtures/x-identity-link-witness.json > "$bare"
          if python3 "$script" "$bare" > "$RUNNER_TEMP/stdout"; then
            echo "::error::a secret witness was written to stdout"; exit 1
          fi
          [ ! -s "$RUNNER_TEMP/stdout" ]
          python3 "$script" "$bare" --out "$RUNNER_TEMP/secret.toml"
          [ "$(stat -c %a "$RUNNER_TEMP/secret.toml")" = 600 ]

      # Full build: proves every circuit compiles, every vk generates, and
      # every Solidity verifier generates under its pinned contract name with
      # the pinned toolchain — the exact path release.yml runs to produce the
      # release assets, so a release cannot break on a step no PR exercised.
      # The output is discarded; artifacts only ever ship from a release
      # build.
      - name: Build artifacts (discarded)
        run: |
          set -euo pipefail
          ./scripts/build.sh --out "$RUNNER_TEMP/artifacts"
          find "$RUNNER_TEMP/artifacts" -type f -exec sha256sum {} +

      # forge compiles the verifiers as a consumer does; anvil and cast run
      # them on chain.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Check the verifiers
        run: ./scripts/check-verifiers.sh --artifacts "$RUNNER_TEMP/artifacts"

  # ---------------------------------------------------------------------------
  # Handle table: lib/identity/src/table.nr and table_tests.nr are what libID-contracts'
  # handles.json generates, at the commit contracts.ref pins. The comparison
  # is libID-contracts' own generator, so no rule is restated here. At the
  # same commit, the vendored fixtures are the ceremony session fixtures'
  # witnesses and oidc-google's digest is theirs. It needs git and Python
  # alone.
  # ---------------------------------------------------------------------------
  handles-table:
    name: Handle table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned libID-contracts commit
        id: pin
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < contracts.ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts.ref must hold one full commit SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Plain git rather than actions/checkout, so a missing commit fails with
      # the fix named: contracts.ref must be reachable from a branch
      # libID-contracts serves, which after a merge is its main.
      - name: Check out libID-contracts at the pin
        env:
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          git init -q libid-contracts
          git -C libid-contracts remote add origin https://github.com/libid-org/libID-contracts.git
          if ! git -C libid-contracts fetch -q --depth 1 origin "$REF"; then
            echo "::error::libID-contracts serves no commit $REF (contracts.ref); a commit only on an unpushed or deleted branch cannot be fetched. Merge the libID-contracts change first, then point contracts.ref at its commit on libID-contracts' main (README, contracts.ref)."
            exit 1
          fi
          git -C libid-contracts checkout -q FETCH_HEAD

      - name: table.nr and table_tests.nr match handles.json
        run: |
          python3 libid-contracts/scripts/regen-identity-handles.py \
            --compare-noir "$GITHUB_WORKSPACE/lib/identity/src/table.nr" \
            --compare-noir-tests "$GITHUB_WORKSPACE/lib/identity/src/table_tests.nr"

      # The vendored witnesses are the session fixtures' `identity_link_witness`
      # members, and oidc-google's nonce is their Authorization Digest.
      - name: Fixtures match libID-contracts' session fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, pathlib, sys

          sessions = pathlib.Path("libid-contracts/solidity/contracts/ceremony/test/fixtures")
          sys.path.insert(0, "scripts")  # google-fixture-witness.py imports identity_table beside it
          spec = importlib.util.spec_from_file_location("google_fixture", "scripts/google-fixture-witness.py")
          google = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(google)
          failed = False
          for platform in ("x", "github"):
              session = json.loads((sessions / f"{platform}-ceremony-session.json").read_text())
              vendored = json.loads(pathlib.Path(f"fixtures/{platform}-identity-link-witness.json").read_text())
              if vendored["identity_link_witness"] != session["identity_link_witness"]:
                  print(f"::error::fixtures/{platform}-identity-link-witness.json differs from {platform}-ceremony-session.json's identity_link_witness; copy it again")
                  failed = True
              if session["authorization_digest"] != "0x" + google.DIGEST.hex():
                  print(f"::error::scripts/google-fixture-witness.py's DIGEST differs from {platform}-ceremony-session.json's authorization_digest {session['authorization_digest']}")
                  failed = True
          sys.exit(failed)
          PY

  # ---------------------------------------------------------------------------
  # DCO: every commit carries a Signed-off-by trailer, as CONTRIBUTING.md
  # promises. Plain git over the event's commit range — no marketplace action,
  # so there is nothing to pin and nothing to compromise. (Same script as
  # libid-contracts.)
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR base and the push's `before` are reachable
          # only in a complete clone, and the repo is small.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            # Push to main. `before` is all zeros on a branch creation and may
            # be unreachable after a force push; in either case there is no
            # honest range, so fall back to the head commit alone rather than
            # failing on plumbing.
            zero="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            else
              echo "No usable push range; checking only the head commit."
              range="$PUSH_AFTER^!"
            fi
          fi

          # Merge commits are exempt, as in the standard DCO probot: nobody
          # authors a merge, and the merged commits are themselves in range.
          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            # Dependabot signs off with its support address, not its author address.
            if [ "$author" = 'dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>' ] \
              && git log -1 --format=%B "$sha" \
                | grep -Fxiq 'Signed-off-by: dependabot[bot] <support@github.com>'; then
              continue
            fi
            if git log -1 --format=%B "$sha" \
              | grep -Fxiq "Signed-off-by: $author"; then
              continue
            fi
            echo "::error::commit $sha lacks Signed-off-by matching its author: $author"
            git log -1 --format='  %h %s (%an)' "$sha"
            missing=1
          done

          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md: every commit must certify the DCO."
            exit 1
          fi
          echo "All commits in $range are signed off."
